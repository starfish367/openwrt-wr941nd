# =====================================================================
# OpenWrt Advanced Kernel & Network Tuning (AR9341 32MB RAM Rock-Solid)
# =====================================================================

# --- 1. Kernel Stability & Self-Healing ---
kernel.panic = 3
kernel.panic_on_oops = 1
kernel.printk = 3 4 1 7
vm.panic_on_oom = 0

# --- 2. Memory & VFS Aggressive Reclaim ---
vm.vfs_cache_pressure = 150
vm.min_free_kbytes = 2048
vm.swappiness = 0
vm.overcommit_memory = 0
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# --- 3. Conntrack Table (Tuned for 32MB RAM, Anti-Exhaustion) ---
net.netfilter.nf_conntrack_max = 4096
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 10
net.netfilter.nf_conntrack_udp_timeout = 15
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_generic_timeout = 60

# --- 4. Queue Discipline (Bufferbloat Mitigation) ---
net.core.default_qdisc = fq_codel

# --- 5. NAPI, Interrupt & Socket Budgets ---
net.core.netdev_budget = 300
net.core.netdev_max_backlog = 1000
net.core.somaxconn = 256
net.core.rmem_max = 262144
net.core.wmem_max = 262144
net.core.rmem_default = 65536
net.core.wmem_default = 65536
net.ipv4.tcp_rmem = 4096 65536 262144
net.ipv4.tcp_wmem = 4096 65536 262144

# --- 6. TCP Low-Latency & Fast Socket Recycling ---
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 1024
net.ipv4.tcp_max_syn_backlog = 256
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_ecn = 0
net.ipv4.ip_local_port_range = 1024 65535

# --- 7. ARP Cache Limits (Prevent Slab Leak) ---
net.ipv4.neigh.default.gc_thresh1 = 128
net.ipv4.neigh.default.gc_thresh2 = 256
net.ipv4.neigh.default.gc_thresh3 = 512
